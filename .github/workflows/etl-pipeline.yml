name: ETL Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install pandas pyarrow holidays boto3 psycopg2-binary pytest
      - name: Run ETL tests
        run: pytest tests/test_etl.py -v
